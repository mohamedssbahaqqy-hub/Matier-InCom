name: Build Matier Calculator APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Matier Calculator APK
    runs-on: ubuntu-latest

    steps:

      # تحميل ملفات المشروع
      - name: Checkout
        uses: actions/checkout@v4


      # إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # إعداد Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # إنشاء مجلد Web
      - name: Create Web App
        run: |
          mkdir -p www

          cp index.html www/index.html
          cp style.css www/style.css
          cp script.js www/script.js


      # إنشاء package.json
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "matier-calculator",
            "version": "1.0.0",
            "private": true
          }
          EOF


      # تثبيت Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # إنشاء تطبيق Android
      - name: Create Android Project
        run: |
          npx cap init "Matier Calculator" "com.incomgroup.matiercalculator" --web-dir www

          npx cap add android

          npx cap sync android


      # بناء APK
      - name: Build APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon


      # رفع APK إلى GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatierCalculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
